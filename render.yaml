databases:
  - name: vtt-postgres
    databaseName: vtt
    plan: free

services:
  - type: web
    name: vtt-campaign-service
    rootDir: campaign-service
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vtt-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: vtt-frontend
    rootDir: frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_CAMPAIGN_URL
        fromService:
          name: vtt-campaign-service
          type: web
          property: host
      - key: NODE_ENV
        value: production
