version: '3.9'

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  vtt-internal:
    driver: bridge
  vtt-observability:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ─── Databases ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt_dev_password
      POSTGRES_DB: vtt_identity
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtt"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: vtt
      MONGO_INITDB_ROOT_PASSWORD: vtt_dev_password
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass vtt_dev_password --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vtt_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vtt
      RABBITMQ_DEFAULT_PASS: vtt_dev_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
      target: production
    env_file:
      - apps/identity-service/.env.local
    environment:
      NODE_ENV: development
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt_dev_password
      POSTGRES_DB: vtt_identity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: vtt_dev_password
      RABBITMQ_URI: amqp://vtt:vtt_dev_password@rabbitmq:5672
      OTEL_SERVICE_NAME: identity-service
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vtt-internal
    restart: unless-stopped

  # ─── Observability ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vtt-internal
      - vtt-observability
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - vtt-observability
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.0
    volumes:
      - loki-data:/loki
      - ./infrastructure/docker/loki/loki-config.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - vtt-observability
    command: -config.file=/etc/loki/local-config.yaml

  jaeger:
    image: jaegertracing/all-in-one:1.56
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - vtt-internal
      - vtt-observability
