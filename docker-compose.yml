# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  vtt-internal:
    driver: bridge
  vtt-observability:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ─── Databases ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt_dev_password
      POSTGRES_DB: vtt_identity
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtt"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: vtt
      MONGO_INITDB_ROOT_PASSWORD: vtt_dev_password
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass vtt_dev_password --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vtt_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vtt
      RABBITMQ_DEFAULT_PASS: vtt_dev_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./infrastructure/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
      target: production
    env_file:
      - path: apps/identity-service/.env.local
        required: false
    environment:
      NODE_ENV: development
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt_dev_password
      POSTGRES_DB: vtt_identity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: vtt_dev_password
      RABBITMQ_URI: amqp://vtt:vtt_dev_password@rabbitmq:5672
      OTEL_SERVICE_NAME: identity-service
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vtt-internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:2567
    ports:
      - "3010:3010"
    depends_on:
      - api-gateway
      - realtime-gateway-service
    networks:
      - vtt-internal
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      JWKS_URL: http://identity-service:3001/.well-known/jwks.json
    ports:
      - "3000:3000"
    depends_on:
      - identity-service
    networks:
      - vtt-internal
    restart: unless-stopped

  campaign-service:
    build:
      context: .
      dockerfile: apps/campaign-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt_dev_password
      POSTGRES_DB: vtt_campaign
      RABBITMQ_URI: amqp://vtt:vtt_dev_password@rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vtt-internal
    restart: unless-stopped

  rules-engine-service:
    build:
      context: .
      dockerfile: apps/rules-engine-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3003
      DICE_HMAC_SECRET: dev-hmac-secret-change-in-production
    ports:
      - "3003:3003"
    networks:
      - vtt-internal
    restart: unless-stopped

  vtt-engine-service:
    build:
      context: .
      dockerfile: apps/vtt-engine-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3004
      MONGODB_URI: mongodb://vtt:vtt_dev_password@mongodb:27017/vtt_engine?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: vtt_dev_password
    ports:
      - "3004:3004"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vtt-internal
    restart: unless-stopped

  realtime-gateway-service:
    build:
      context: .
      dockerfile: apps/realtime-gateway-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 2567
      REDIS_URL: redis://:vtt_dev_password@redis:6379
      VTT_ENGINE_URL: http://vtt-engine-service:3004
      RULES_ENGINE_URL: http://rules-engine-service:3003
      JWKS_URL: http://identity-service:3001/.well-known/jwks.json
      DICE_HMAC_SECRET: dev-hmac-secret-change-in-production
      MAX_CLIENTS_PER_ROOM: 8
      PATCH_RATE_MS: 50
    ports:
      - "2567:2567"
    depends_on:
      redis:
        condition: service_healthy
      vtt-engine-service:
        condition: service_started
      rules-engine-service:
        condition: service_started
    networks:
      - vtt-internal
    restart: unless-stopped

  # ─── Fase 02: Compendium Service ─────────────────────────────────────────────

  compendium-service:
    build:
      context: .
      dockerfile: apps/compendium-service/Dockerfile
    environment:
      NODE_ENV: development
      COMPENDIUM_PORT: 3040
      MONGODB_URI: mongodb://vtt:vtt_dev_password@mongodb:27017/vtt_compendium?authSource=admin
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:3000
      SEED_ON_BOOT: "true"
      LOG_LEVEL: debug
    ports:
      - "3040:3040"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vtt-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3040/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ─── Observabilidade ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vtt-internal
      - vtt-observability
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - vtt-observability
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.0
    volumes:
      - loki-data:/loki
      - ./infrastructure/docker/loki/loki-config.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - vtt-observability
    command: -config.file=/etc/loki/local-config.yaml

  jaeger:
    image: jaegertracing/all-in-one:1.56
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - vtt-internal
      - vtt-observability
