replicaCount: 3

image:
  repository: ghcr.io/vtt/realtime-gateway-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 2567
  metricsPort: 9090

# WebSocket requires sticky sessions — use Redis presence for multi-node
sessionAffinity:
  enabled: true
  timeoutSeconds: 10800 # 3h

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

deployment:
  strategy: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 2567
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 2567
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

env:
  NODE_ENV: production
  PORT: "2567"
  MAX_CLIENTS_PER_ROOM: "8"
  PATCH_RATE_MS: "50"
  LOG_LEVEL: info

externalSecrets:
  enabled: true
  secretStoreName: vault-backend
  refreshInterval: 1h
  secrets:
    - remoteKey: vtt/realtime-gateway-service
      data:
        - secretKey: REDIS_URL
          remoteRef:
            key: redis_url
        - secretKey: DICE_HMAC_SECRET
          remoteRef:
            key: dice_hmac_secret

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
    - to:
        - podSelector:
            matchLabels:
              app: vtt-engine-service
    - to:
        - podSelector:
            matchLabels:
              app: rules-engine-service

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
  port: metrics
