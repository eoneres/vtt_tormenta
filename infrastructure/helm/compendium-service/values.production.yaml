replicaCount: 3

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

env:
  NODE_ENV: production
  LOG_LEVEL: warn
  SEED_ON_BOOT: "false"
  CACHE_TTL_SECONDS: "600"
  SEARCH_RESULTS_LIMIT: "50"

podDisruptionBudget:
  enabled: true
  minAvailable: 2
