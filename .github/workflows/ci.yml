name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vtt

jobs:
  # ─── Stage 1: Lint & Typecheck ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

  # ─── Stage 2: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm turbo run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Assert coverage thresholds
        run: |
          echo "Checking coverage thresholds across all services..."
          # Each service must maintain >80% branch coverage
          pnpm turbo run test:coverage -- --coverageThreshold='{"global":{"branches":80,"functions":85,"lines":85,"statements":85}}'

  # ─── Stage 2b: Integration Tests ────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: --health-cmd "mongosh --eval 'db.runCommand({ping:1})'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vtt_test
          POSTGRES_USER: vtt
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm turbo run test:integration
        env:
          MONGODB_URI: mongodb://localhost:27017/vtt_test
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://vtt:test_password@localhost:5432/vtt_test

  # ─── Stage 3: Secret Scanning ───────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Stage 4: SAST ──────────────────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: typescript

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  # ─── Stage 5: SCA ───────────────────────────────────────────────────────────
  sca:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  # ─── Stage 6: Build & Container Scan ────────────────────────────────────────
  build-scan:
    name: Build & Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [unit-tests, secret-scan]
    strategy:
      matrix:
        service:
          - identity-service
          - campaign-service
          - rules-engine-service
          - vtt-engine-service
          - realtime-gateway-service
          - compendium-service
          - marketplace-service
          - notification-service
          - billing-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/${{ matrix.service }}.tar
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ─── Stage 7: IaC Scan ──────────────────────────────────────────────────────
  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform,helm,kubernetes,dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

  # ─── Stage 8: Push to Registry ──────────────────────────────────────────────
  push:
    name: Push Images
    runs-on: ubuntu-latest
    needs: [build-scan, sast, sca, iac-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - identity-service
          - campaign-service
          - rules-engine-service
          - vtt-engine-service
          - realtime-gateway-service
          - compendium-service
          - marketplace-service
          - notification-service
          - billing-service
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 9: Deploy Staging ────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Deploy with Helm
        run: |
          for service in identity-service campaign-service rules-engine-service vtt-engine-service realtime-gateway-service compendium-service notification-service marketplace-service billing-service; do
            helm upgrade --install $service ./infrastructure/helm/$service \
              --namespace vtt-staging \
              --create-namespace \
              --set image.tag=${{ github.sha }} \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$service \
              --values ./infrastructure/helm/$service/values.staging.yaml \
              --wait --timeout 5m
          done

  # ─── Stage 10: E2E Tests ────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ─── Stage 11: Deploy Production ────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (Blue/Green)
    runs-on: ubuntu-latest
    needs: [push]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Blue/Green Deploy
        run: |
          for service in identity-service campaign-service rules-engine-service vtt-engine-service realtime-gateway-service compendium-service notification-service marketplace-service billing-service; do
            helm upgrade --install $service ./infrastructure/helm/$service \
              --namespace vtt-production \
              --set image.tag=${{ github.sha }} \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$service \
              --values ./infrastructure/helm/$service/values.production.yaml \
              --set deployment.strategy=RollingUpdate \
              --set deployment.maxSurge=1 \
              --set deployment.maxUnavailable=0 \
              --wait --timeout 10m \
              --atomic  # Automatic rollback on failure
          done
